name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install PyQt6
      - run: python -m py_compile savedesktopdesign.py
      - run: bash -n install.sh
      - name: Run offline tests
        run: |
          python - <<'PY'
          import subprocess
          import sys
          result = subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "tests", "-v"],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  text=True, errors="replace")
          print(result.stdout)
          if result.returncode:
              detail = result.stdout[-20000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Offline tests failed::" + detail)
          sys.exit(result.returncode)
          PY
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: offline-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        run: |
          python3 - <<'PY'
          import ast
          import os
          from pathlib import Path
          tree = ast.parse(Path("savedesktopdesign.py").read_text())
          versions = [node.value.value for node in tree.body
                      if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == "VERSION"
                              for target in node.targets)]
          assert versions == [os.environ["GITHUB_REF_NAME"].removeprefix("v")], versions
          PY
      - name: Publish tested version
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" savedesktopdesign.py
          --verify-tag --title "SaveYourKDEDesign $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md --latest
